name: CI Pipeline

# Scoped to what THIS repo actually contains.
#
# The previous version dates from when nw was a monorepo: it ran a matrix over
# [cppm, cs, ldap, netbox, opnsense, pxmx, lm/core, qa], npm-built lm/WebUI, and
# docker-built cs/opnsense/pxmx/lm images. Every one of those modules has since
# been split into its own repository, so each job did `cd <module>` into a
# directory that no longer exists and the pipeline failed on every single push
# ("cd lm/core: No such file or directory").
#
# nw now contains: src/ (nw_engine, nw_spoke, control_plane, transports),
# tests/, scripts/, audit/*.sh. The split-out modules run their own CI in their
# own repos; duplicating it here could only ever test a stale copy.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - name: Install linters
        run: pip install ruff bandit pip-audit
      - name: Run analysis
        run: |
          # Non-blocking, matching the previous posture: these report, they do
          # not gate. Tighten deliberately rather than by accident.
          ruff check src scripts tests || echo "Ruff found issues"
          bandit -r src scripts || echo "Bandit found issues"
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || echo "pip-audit found issues"
          fi

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck audit/*.sh || echo "ShellCheck found issues"

  test-unit:
    needs: [lint-python, lint-shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          pip install pytest
          [ -f requirements.txt ] && pip install -r requirements.txt || true
      - name: Compile check
        run: find src scripts -name '*.py' -exec python -m py_compile {} +
      - name: Run tests
        run: |
          # Only run pytest when this repo actually has tests, so an empty
          # tests/ reports honestly instead of failing with "no tests ran".
          if [ -n "$(find tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            pytest tests/
          else
            echo "no test_*.py under tests/ — skipping pytest"
          fi
