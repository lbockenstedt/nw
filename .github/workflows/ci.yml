name: CI Pipeline

# Scoped to what THIS repo actually contains.
#
# The previous version dates from when nw was a monorepo: it ran a matrix over
# [cppm, cs, ldap, netbox, opnsense, pxmx, lm/core, qa], npm-built lm/WebUI, and
# docker-built cs/opnsense/pxmx/lm images. Every one of those modules has since
# been split into its own repository, so each job did `cd <module>` into a
# directory that no longer exists and the pipeline failed on every single push
# ("cd lm/core: No such file or directory").
#
# nw now contains: src/ (nw_engine, nw_spoke, control_plane, transports),
# tests/, scripts/, audit/*.sh. The split-out modules run their own CI in their
# own repos; duplicating it here could only ever test a stale copy.

# `qa` and `main` require a PR; this job is the status check that makes those
# gates mean something. dev also runs on direct pushes, which contributors are
# allowed to make.
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, qa, dev ]

# A newer push to the same branch or PR makes the older run pointless. The
# event name keeps an lm-changed dispatch from cancelling a dev push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first (about 20 s): fleet rules, new ruff errors, twin files
  # (lm/docs/ci-checks.md). `test-unit` waits for them, so a rule violation fails
  # the run before the install and test steps start. Dev only: promotion PRs
  # into qa/main carry commits that already passed here.
  checks:
    if: (github.event_name == 'push' && github.ref_name == 'dev') || github.base_ref == 'dev'
    permissions:
      contents: read
    uses: lbockenstedt/lm/.github/workflows/fleet-rules-reusable.yml@main

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install linters
        run: pip install ruff bandit pip-audit
      - name: Run analysis
        run: |
          # Non-blocking, matching the previous posture: these report, they do
          # not gate. Tighten deliberately rather than by accident.
          ruff check src scripts tests || echo "Ruff found issues"
          bandit -r src scripts || echo "Bandit found issues"
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || echo "pip-audit found issues"
          fi

  lint-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck audit/*.sh || echo "ShellCheck found issues"

  test-unit:
    # Run when checks passed or were skipped (qa/main PRs, lm-changed);
    # the first step fails the job when checks failed.
    if: ${{ !cancelled() }}
    needs: [checks, lint-python, lint-shell]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop early when an earlier job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::A job this one needs failed (see 'checks'). Tests not run."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - name: Install deps
        run: |
          pip install pytest pytest-timeout
          [ -f requirements.txt ] && pip install -r requirements.txt || true
      - name: Compile check
        run: find src scripts -name '*.py' -exec python -m py_compile {} +
      - name: Run tests
        run: |
          # Only run pytest when this repo actually has tests, so an empty
          # tests/ reports honestly instead of failing with "no tests ran".
          if [ -n "$(find tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            pytest --timeout=300 --timeout-method=thread tests/
          else
            echo "no test_*.py under tests/ — skipping pytest"
          fi
